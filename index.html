<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모세공동체 나눔 질문 뽑기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        /* Card pop animation */
        .card-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* 3D Red Push Button Styles */
        .push-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff5252 0%, #d32f2f 60%, #9a0007 100%);
            box-shadow: 
                0 12px 25px rgba(211, 47, 47, 0.4),
                inset 0 4px 8px rgba(255, 255, 255, 0.4),
                inset 0 -6px 8px rgba(0, 0, 0, 0.4);
            border: none;
            cursor: pointer;
            color: white;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.08s ease-in-out;
            outline: none;
            user-select: none;
        }
        .push-btn:hover {
            background: radial-gradient(circle at 35% 35%, #ff6b6b 0%, #e53e3e 60%, #b91c1c 100%);
            box-shadow: 
                0 15px 30px rgba(211, 47, 47, 0.5),
                inset 0 4px 10px rgba(255, 255, 255, 0.5),
                inset 0 -6px 10px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .push-btn:active {
            transform: translateY(6px);
            box-shadow: 
                0 4px 10px rgba(211, 47, 47, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.2),
                inset 0 -2px 4px rgba(0, 0, 0, 0.5);
            background: radial-gradient(circle at 50% 50%, #d32f2f 0%, #b91c1c 70%, #7f1d1d 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 text-slate-800">

    <header class="text-center mt-4 mb-2">
        <span class="inline-block bg-indigo-100 text-indigo-700 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2 shadow-sm">
            모세공동체 &middot; 만청 소그룹
        </span>
        <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight text-slate-900">
            나눔 질문 뽑기
        </h1>
        <p class="text-xs md:text-sm text-slate-600 mt-1">
            아래 버튼을 눌러 오늘의 생각을 함께 나눠보세요
        </p>
    </header>

    <main class="w-full max-w-md mx-auto my-auto flex flex-col items-center">
        <div id="questionCard" class="w-full bg-white rounded-3xl p-8 md:p-10 shadow-xl border border-slate-100 text-center relative min-h-[220px] flex flex-col justify-center items-center transition-all duration-300">
            
            <!-- Index Badge -->
            <div id="questionIndex" class="absolute top-4 left-6 text-xs font-semibold text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-md hidden">
                Q. 0
            </div>

            <!-- Question Text -->
            <div id="questionContainer" class="my-2">
                <p class="text-slate-400 text-base md:text-lg font-medium">
                    버튼을 눌러 질문을 뽑아주세요!
                </p>
            </div>
        </div>

        <div class="mt-8 flex justify-center">
            <button onclick="drawRandomQuestion()" class="push-btn" aria-label="질문뽑기">
                질문뽑기
            </button>
        </div>
    </main>

    <footer class="mt-6 text-center text-slate-500 text-xs">
        <p>&copy; 모세공동체 나눔 웹 애플리케이션</p>
    </footer>

    <script>
        const questions = [
            "내가 생각하는 모세공동체는 어떤 공동체인가?",
            "내가 생각하는 인우목사님은 어떤 사람인가?",
            "지금 모세에 가장 필요한 것은 무엇인가?",
            "우리 공동체에서 나의 역할은 무엇인가?",
            "리더들과 해보고 싶은게 있다면?",
            "모세는, 만청은 지금 살아 있는 공동체인가 유지되는 공동체인가",
            "내가 생각하는 모세 공동체 리더의 모습은?",
            "내가 꿈꾸는 공동체, 교회는 어떤 교회인가?"
        ];

        let lastIndex = -1;

        function drawRandomQuestion() {
            const card = document.getElementById('questionCard');
            const container = document.getElementById('questionContainer');
            const indexBadge = document.getElementById('questionIndex');

            // Select random question avoiding immediate repetition
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * questions.length);
            } while (randomIndex === lastIndex && questions.length > 1);

            lastIndex = randomIndex;
            const selectedQuestion = questions[randomIndex];

            // Re-trigger animation
            card.classList.remove('card-pop');
            void card.offsetWidth; 
            card.classList.add('card-pop');

            // Update DOM
            indexBadge.classList.remove('hidden');
            indexBadge.textContent = `Q. ${randomIndex + 1}`;

            container.innerHTML = `
                <p class="text-lg md:text-xl font-bold text-slate-800 leading-snug">
                    "${selectedQuestion}"
                </p>
            `;
        }
    </script>
</body>
</html>
